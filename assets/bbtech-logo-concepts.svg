<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">BBTech logo concepts</title>
  <desc id="desc">Five BBTech logo concepts using the brand teal, gold, amber and dark palette.</desc>
  <defs>
    <linearGradient id="tealGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#71e7d4"/>
      <stop offset="1" stop-color="#e4bd6b"/>
    </linearGradient>
    <linearGradient id="amberTeal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c87955"/>
      <stop offset="1" stop-color="#71e7d4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .bg { fill: #050607; }
      .panel { fill: #090b0c; stroke: rgba(113, 231, 212, 0.25); stroke-width: 1; }
      .muted { fill: #aeb7b1; font: 500 24px Avenir Next, Inter, Arial, sans-serif; letter-spacing: 0; }
      .label { fill: #e4bd6b; font: 800 16px Avenir Next, Inter, Arial, sans-serif; letter-spacing: 3px; }
      .word { fill: #f4f2ec; font: 820 50px Avenir Next, Inter, Arial, sans-serif; letter-spacing: 1px; }
      .wordSmall { fill: #f4f2ec; font: 760 36px Avenir Next, Inter, Arial, sans-serif; letter-spacing: 0.5px; }
      .sub { fill: #aeb7b1; font: 520 19px Avenir Next, Inter, Arial, sans-serif; letter-spacing: 1.8px; }
      .bb { font: 900 74px Avenir Next, Inter, Arial, sans-serif; letter-spacing: -3px; }
      .bbSmall { font: 900 47px Avenir Next, Inter, Arial, sans-serif; letter-spacing: -2px; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1200"/>
  <circle cx="240" cy="90" r="280" fill="#71e7d4" opacity="0.05"/>
  <circle cx="1620" cy="1130" r="360" fill="#e4bd6b" opacity="0.05"/>

  <text x="90" y="95" class="label">BBTECH LOGO EXPLORATIONS</text>
  <text x="90" y="135" class="muted">Autoridad, confianza, simple con energia de marca.</text>

  <g transform="translate(90 205)" filter="url(#softShadow)">
    <rect class="panel" width="500" height="380" rx="18"/>
    <text x="34" y="52" class="label">01 / MONOGRAMA FIRME</text>
    <g transform="translate(54 102)">
      <rect x="0" y="0" width="130" height="130" rx="18" fill="#07100f" stroke="#71e7d4" stroke-width="3"/>
      <path d="M27 24h45c27 0 43 13 43 34 0 13-7 23-19 29 17 6 26 18 26 35 0 25-19 40-50 40H27V24Zm33 28v24h15c9 0 15-5 15-12s-6-12-15-12H60Zm0 50v32h20c11 0 18-6 18-16s-7-16-18-16H60Z" transform="scale(.75)" fill="#71e7d4"/>
      <text x="38" y="86" class="bb" fill="#f4f2ec">B</text>
      <path d="M100 28v74" stroke="#e4bd6b" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="214" y="166" class="word">BBTech</text>
    <text x="216" y="202" class="sub">B2B OPPORTUNITIES</text>
    <text x="34" y="326" class="muted">Solido, premium, facil de usar como favicon.</text>
  </g>

  <g transform="translate(650 205)" filter="url(#softShadow)">
    <rect class="panel" width="500" height="380" rx="18"/>
    <text x="34" y="52" class="label">02 / SENAL COMERCIAL</text>
    <g transform="translate(55 104)">
      <circle cx="66" cy="66" r="63" fill="#07100f" stroke="url(#tealGold)" stroke-width="4"/>
      <circle cx="66" cy="66" r="9" fill="#e4bd6b"/>
      <path d="M66 66 L106 31" stroke="#71e7d4" stroke-width="6" stroke-linecap="round"/>
      <path d="M66 66 L102 100" stroke="#c87955" stroke-width="6" stroke-linecap="round"/>
      <circle cx="106" cy="31" r="10" fill="#71e7d4"/>
      <circle cx="102" cy="100" r="10" fill="#c87955"/>
      <path d="M30 104c20 23 52 30 82 18" fill="none" stroke="#e4bd6b" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="214" y="166" class="word">BBTech</text>
    <text x="216" y="202" class="sub">RELATION SIGNALS</text>
    <text x="34" y="326" class="muted">Representa redes, senales y oportunidades.</text>
  </g>

  <g transform="translate(1210 205)" filter="url(#softShadow)">
    <rect class="panel" width="500" height="380" rx="18"/>
    <text x="34" y="52" class="label">03 / SELLO DE AUTORIDAD</text>
    <g transform="translate(60 102)">
      <path d="M66 0l58 34v65l-58 34L8 99V34L66 0Z" fill="#07100f" stroke="#e4bd6b" stroke-width="4"/>
      <path d="M34 51h65M34 79h65" stroke="#71e7d4" stroke-width="9" stroke-linecap="round"/>
      <path d="M47 31v68M86 31v68" stroke="#f4f2ec" stroke-width="9" stroke-linecap="round" opacity="0.96"/>
    </g>
    <text x="214" y="166" class="word">BBTech</text>
    <text x="216" y="202" class="sub">TRUSTED B2B SYSTEMS</text>
    <text x="34" y="326" class="muted">Mas institucional, ideal si buscamos confianza.</text>
  </g>

  <g transform="translate(370 650)" filter="url(#softShadow)">
    <rect class="panel" width="500" height="380" rx="18"/>
    <text x="34" y="52" class="label">04 / PUENTE B2B</text>
    <g transform="translate(55 106)">
      <rect x="0" y="0" width="132" height="132" rx="22" fill="#07100f" stroke="#71e7d4" stroke-width="3"/>
      <path d="M30 82c16-28 56-28 72 0" fill="none" stroke="#e4bd6b" stroke-width="8" stroke-linecap="round"/>
      <path d="M30 51c16 28 56 28 72 0" fill="none" stroke="#71e7d4" stroke-width="8" stroke-linecap="round"/>
      <circle cx="30" cy="66" r="10" fill="#c87955"/>
      <circle cx="102" cy="66" r="10" fill="#71e7d4"/>
      <text x="39" y="78" class="bbSmall" fill="#f4f2ec">BB</text>
    </g>
    <text x="214" y="166" class="word">BBTech</text>
    <text x="216" y="202" class="sub">RELATION PIPELINE</text>
    <text x="34" y="326" class="muted">Mas humano: conecta dos lados del negocio.</text>
  </g>

  <g transform="translate(930 650)" filter="url(#softShadow)">
    <rect class="panel" width="500" height="380" rx="18"/>
    <text x="34" y="52" class="label">05 / WORDMARK VIBRANTE</text>
    <g transform="translate(46 118)">
      <text x="0" y="80" class="bb" fill="#f4f2ec">BB</text>
      <text x="113" y="80" class="bb" fill="url(#tealGold)">Tech</text>
      <path d="M5 103h265" stroke="url(#amberTeal)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="284" cy="103" r="8" fill="#e4bd6b"/>
      <circle cx="309" cy="103" r="8" fill="#71e7d4"/>
    </g>
    <text x="48" y="254" class="sub">B2B OPPORTUNITY SYSTEMS</text>
    <text x="34" y="326" class="muted">El mas simple para web y perfiles sociales.</text>
  </g>
</svg>
